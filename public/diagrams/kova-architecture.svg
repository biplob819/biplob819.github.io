<text x="564.0" y="657.0" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">rate limiting</text>
<rect x="660" y="584" width="168" height="98" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
