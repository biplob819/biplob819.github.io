<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Kova module build order</title>
<desc id="d">Kova is built core first, then outward in waves; a module starts only when everything it depends on is built. Wave 0 platform and Wave 1 core spine are built. Wave 2: time off and documents with e-signature built, self-service in progress. Wave 3: time and attendance built, hiring and onboarding planned. Wave 4 payroll, benefits, compensation, performance and experience, Wave 5 cross-module work and Wave 6 AI platform are planned; AI comes last by design.</desc>
