<rect x="795" y="96" width="170" height="62" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="880.0" y="122.5" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">BI engine</text>
<text x="880.0" y="141.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">open source, unmodified</text>
