<rect x="608" y="96" width="170" height="62" rx="10" fill="#d5f5ef" stroke="#0f766e" stroke-width="1.5"/>
<text x="693.0" y="122.5" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Query gateway</text>
<text x="693.0" y="141.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">control plane</text>
