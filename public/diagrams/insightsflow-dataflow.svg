<text x="320.0" y="122.5" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Customer's backend</text>
<text x="320.0" y="141.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">their server</text>
