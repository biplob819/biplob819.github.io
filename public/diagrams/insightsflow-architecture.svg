<text x="876.0" y="315.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">permission-scoped</text>
<text x="876.0" y="334.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">tools; none takes</text>
<text x="876.0" y="353.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">a tenant argument</text>
<rect x="980" y="256" width="168" height="128" rx="10" fill="#e8e9fb" stroke="#4c51bf" stroke-width="1.5"/>
<text x="1064.0" y="296.5" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">AI chat routes</text>
<text x="1064.0" y="315.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">quota check,</text>
<text x="1064.0" y="334.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">token exchanged</text>
<text x="1064.0" y="353.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">for each hop</text>
<line x1="28" y1="420" x2="1172" y2="420" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="7 6"/>
