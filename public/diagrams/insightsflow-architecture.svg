<text x="312.0" y="517.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">open source,</text>
<text x="312.0" y="536.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">self-hosted,</text>
<text x="312.0" y="555.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">driven by our API</text>
<rect x="416" y="462" width="168" height="120" rx="10" fill="#d5f5ef" stroke="#0f766e" stroke-width="2"/>
<text x="500.0" y="498.5" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">ClickHouse</text>
<text x="500.0" y="517.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">one database and</text>
<text x="500.0" y="536.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">warehouse user</text>
<text x="500.0" y="555.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">per tenant</text>
