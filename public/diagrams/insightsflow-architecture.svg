<text x="688.0" y="315.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">tenant from the</text>
<text x="688.0" y="334.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">verified token;</text>
<text x="688.0" y="353.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">RBAC filters injected</text>
<rect x="792" y="256" width="168" height="128" rx="10" fill="#e8e9fb" stroke="#4c51bf" stroke-width="1.5"/>
