<text x="218.0" y="173.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">Next.js · build dashboards, reports and models</text>
<rect x="416" y="124" width="356" height="70" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="594.0" y="154.5" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Embedded SDK in the customer's product</text>
<text x="594.0" y="173.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">web component + React · designed</text>
<rect x="792" y="124" width="356" height="70" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="970.0" y="154.5" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">AI chat</text>
<text x="970.0" y="173.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">in the web app today; in the embed next</text>
<rect x="28" y="216" width="1144" height="184" rx="14" fill="#eceff3"/>
<text x="44" y="242" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Control plane API</text>
<text x="200.2" y="242" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">NestJS · the only thing a browser can reach</text>
<rect x="40" y="256" width="168" height="128" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="124.0" y="296.5" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Control-plane DB</text>
<text x="124.0" y="315.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">PostgreSQL:</text>
<text x="124.0" y="334.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">tenants, users,</text>
<text x="124.0" y="353.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">roles, dashboards</text>
<rect x="228" y="256" width="356" height="128" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="406.0" y="296.5" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Auth and roles</text>
<text x="406.0" y="315.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">sessions, SSO, SCIM, RBAC</text>
<text x="406.0" y="334.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">per-end-user embed tokens:</text>
<text x="406.0" y="353.5" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">signed, short-lived (designed)</text>
