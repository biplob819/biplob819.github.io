<text x="40" y="76" font-size="15" fill="#52606d">Embedded + self-serve analytics · own control plane over unmodified open-source engines</text>
<text x="40" y="112" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Where people use it</text>
