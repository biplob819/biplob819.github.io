<rect x="40" y="462" width="168" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="124.0" y="489.0" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Source apps</text>
<text x="124.0" y="508.0" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">SaaS apps,</text>
<text x="124.0" y="527.0" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">databases, files</text>
<text x="124.0" y="546.0" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">597 catalogued,</text>
<text x="124.0" y="565.0" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">6 proven live</text>
<rect x="228" y="462" width="168" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
